<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracker - Professional Trading Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-tertiary: #1f2937;
            --bg-card: #151c2c;
            --border-color: #2d3748;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --green: #10b981;
            --green-bright: #34d399;
            --green-bg: rgba(16, 185, 129, 0.15);
            --red: #ef4444;
            --red-bright: #f87171;
            --red-bg: rgba(239, 68, 68, 0.15);
            --yellow: #f59e0b;
            --yellow-bg: rgba(245, 158, 11, 0.15);
            --blue: #3b82f6;
            --purple: #8b5cf6;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .logo-icon { font-size: 2rem; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .market-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Layout */
        .main-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: calc(100vh - 65px);
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            overflow-y: auto;
        }

        .sidebar-section { margin-bottom: 1.5rem; }

        .sidebar-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .watchlist-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 0.4rem;
            transition: all 0.2s;
        }

        .watchlist-btn:hover {
            background: var(--bg-card);
            border-color: var(--blue);
            transform: translateX(4px);
        }

        .watchlist-btn.active {
            border-color: var(--blue);
            background: rgba(59, 130, 246, 0.15);
        }

        .watchlist-count {
            background: var(--bg-primary);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .custom-input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .custom-input:focus {
            outline: none;
            border-color: var(--blue);
        }

        .scan-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        /* Content */
        .content {
            padding: 1.5rem 2rem;
            overflow-y: auto;
        }

        /* Top Opportunities */
        .opportunities-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .opportunity-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .opportunity-card.buy { border-left: 4px solid var(--green); }
        .opportunity-card.sell { border-left: 4px solid var(--red); }

        .opportunity-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .opportunity-header.buy { color: var(--green-bright); }
        .opportunity-header.sell { color: var(--red-bright); }

        .top-pick {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .top-pick:hover {
            background: var(--bg-secondary);
        }

        .pick-symbol {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .pick-details {
            text-align: right;
        }

        .pick-score {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .pick-score.buy { color: var(--green-bright); }
        .pick-score.sell { color: var(--red-bright); }

        .pick-reason {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* Summary Stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .stat-value.green { color: var(--green-bright); }
        .stat-value.red { color: var(--red-bright); }
        .stat-value.yellow { color: var(--yellow); }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Signals Table */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        .table-title {
            font-weight: 600;
        }

        .signals-table {
            width: 100%;
            border-collapse: collapse;
        }

        .signals-table th {
            background: var(--bg-tertiary);
            padding: 0.85rem 1rem;
            text-align: left;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .signals-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .signals-table tr:last-child td { border-bottom: none; }

        .signals-table tbody tr {
            cursor: pointer;
            transition: background 0.2s;
        }

        .signals-table tbody tr:hover {
            background: var(--bg-tertiary);
        }

        .symbol-cell {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .symbol-icon {
            width: 36px;
            height: 36px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .symbol-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .price-cell {
            font-family: 'SF Mono', Monaco, 'Consolas', monospace;
            font-size: 0.9rem;
        }

        .signal-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .signal-badge.buy {
            background: var(--green-bg);
            color: var(--green-bright);
        }

        .signal-badge.sell {
            background: var(--red-bg);
            color: var(--red-bright);
        }

        .signal-badge.hold {
            background: var(--yellow-bg);
            color: var(--yellow);
        }

        .score-cell {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .score-bar {
            width: 80px;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            border-radius: 3px;
        }

        .score-bar-fill.positive { background: var(--green); }
        .score-bar-fill.negative { background: var(--red); }

        .score-value {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .score-value.positive { color: var(--green-bright); }
        .score-value.negative { color: var(--red-bright); }

        .reason-cell {
            font-size: 0.8rem;
            color: var(--text-secondary);
            max-width: 200px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 95%;
            max-width: 1000px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
        }

        .modal-title-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .modal-symbol {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .modal-price {
            font-size: 1.25rem;
            color: var(--text-secondary);
        }

        .modal-close {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--red-bg);
            color: var(--red);
        }

        .modal-body { padding: 1.5rem; }

        /* Signal Summary Card */
        .signal-summary {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.5rem;
        }

        .summary-main {
            text-align: center;
            padding: 1rem;
            border-radius: 10px;
        }

        .summary-main.buy { background: var(--green-bg); }
        .summary-main.sell { background: var(--red-bg); }
        .summary-main.hold { background: var(--yellow-bg); }

        .summary-signal {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .summary-signal.buy { color: var(--green-bright); }
        .summary-signal.sell { color: var(--red-bright); }
        .summary-signal.hold { color: var(--yellow); }

        .summary-score {
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .trade-setup {
            background: var(--bg-tertiary);
            border-radius: 10px;
            padding: 1rem;
        }

        .trade-setup-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            letter-spacing: 0.5px;
        }

        .trade-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .trade-row:last-child { border-bottom: none; }

        .trade-label { color: var(--text-secondary); font-size: 0.85rem; }

        .trade-value { font-weight: 600; font-size: 0.9rem; }

        .trade-value.green { color: var(--green-bright); }
        .trade-value.red { color: var(--red-bright); }

        /* Analysis Section */
        .analysis-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .analysis-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .key-insight {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-left: 3px solid var(--blue);
        }

        .insight-text {
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Indicators Grid */
        .indicators-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .indicator-card {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .indicator-name {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .indicator-signal {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .indicator-signal.buy { background: var(--green-bg); color: var(--green-bright); }
        .indicator-signal.sell { background: var(--red-bg); color: var(--red-bright); }
        .indicator-signal.neutral { background: var(--yellow-bg); color: var(--yellow); }

        /* Chart */
        .chart-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.25rem;
        }

        /* Loading & Empty States */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-icon { font-size: 4rem; margin-bottom: 1rem; }

        /* Responsive */
        @media (max-width: 1200px) {
            .stats-row { grid-template-columns: repeat(3, 1fr); }
            .opportunities-section { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .signal-summary { grid-template-columns: 1fr; }
            .indicators-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <span class="logo-icon">📈</span>
            <span>Live Tracker</span>
        </div>
        <div class="header-right">
            <div class="market-status">
                <span class="status-dot"></span>
                <span>Market Data Live</span>
            </div>
            <div id="currentTime" style="color: var(--text-secondary); font-size: 0.85rem;"></div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Quick Scan</div>
                <button class="watchlist-btn" onclick="scanWatchlist('top10', ['SPY','QQQ','AAPL','MSFT','GOOGL','AMZN','NVDA','TSLA','AMD','META'])">
                    <span>🔥 Top 10 Stocks</span>
                    <span class="watchlist-count">10</span>
                </button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Watchlists</div>
                {% for name, symbols in watchlists.items() %}
                <button class="watchlist-btn" onclick="scanWatchlist('{{ name }}', {{ symbols | tojson }})">
                    <span>{{ name | capitalize }}</span>
                    <span class="watchlist-count">{{ symbols | length }}</span>
                </button>
                {% endfor %}
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Custom Scan</div>
                <input type="text" class="custom-input" id="customSymbols" placeholder="AAPL, NVDA, TSLA...">
                <button class="scan-btn" onclick="scanCustom()">
                    🔍 Scan Symbols
                </button>
            </div>
        </aside>

        <main class="content">
            <div id="mainContent">
                <div class="empty-state">
                    <div class="empty-icon">🎯</div>
                    <h3 style="margin-bottom: 0.5rem;">Ready to Scan</h3>
                    <p>Select a watchlist or enter symbols to analyze</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title-section">
                    <span class="modal-symbol" id="modalSymbol">AAPL</span>
                    <span class="modal-price" id="modalPrice">$150.00</span>
                </div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Analyzing...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update time
        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        let currentSymbols = [];
        let lastResults = [];

        // Generate trading insight based on indicators
        function generateInsight(result) {
            const dominated = [];
            if (result.indicators) {
                for (const [name, data] of Object.entries(result.indicators)) {
                    if (data.signal.includes('STRONG')) {
                        dominated.push(name);
                    }
                }
            }

            if (result.signal === 'BUY') {
                if (result.strength === 'STRONG') {
                    return `Strong bullish momentum. ${dominated.length > 0 ? dominated.slice(0,2).join(', ') + ' showing strength.' : 'Multiple indicators aligned.'}`;
                }
                return 'Moderate buy signal with improving technicals.';
            } else if (result.signal === 'SELL') {
                if (result.strength === 'STRONG') {
                    return `Strong bearish pressure. ${dominated.length > 0 ? dominated.slice(0,2).join(', ') + ' signaling weakness.' : 'Multiple sell signals detected.'}`;
                }
                return 'Caution advised - bearish signals present.';
            }
            return 'Mixed signals - wait for clearer direction.';
        }

        // Scan watchlist
        async function scanWatchlist(name, symbols) {
            currentSymbols = symbols;
            document.querySelectorAll('.watchlist-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.closest('.watchlist-btn').classList.add('active');
            }
            await performScan(symbols, name);
        }

        // Scan custom
        async function scanCustom() {
            const input = document.getElementById('customSymbols').value;
            if (!input.trim()) return;
            const symbols = input.split(',').map(s => s.trim().toUpperCase()).filter(s => s);
            currentSymbols = symbols;
            await performScan(symbols, 'Custom');
        }

        // Perform scan
        async function performScan(symbols, scanName) {
            document.getElementById('mainContent').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Scanning ${symbols.length} symbols...</span>
                </div>
            `;

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbols })
                });

                const data = await response.json();
                if (data.success) {
                    lastResults = data.results;
                    displayResults(data.results, scanName);
                }
            } catch (error) {
                document.getElementById('mainContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠️</div>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Display results
        function displayResults(results, scanName) {
            results.sort((a, b) => b.score - a.score);

            const buys = results.filter(r => r.signal === 'BUY');
            const sells = results.filter(r => r.signal === 'SELL');
            const strongBuys = buys.filter(r => r.strength === 'STRONG');
            const strongSells = sells.filter(r => r.strength === 'STRONG');

            // Top picks
            const topBuy = buys[0];
            const topSell = sells[sells.length - 1];

            let html = `
                <!-- Top Opportunities -->
                <div class="opportunities-section">
                    <div class="opportunity-card buy">
                        <div class="opportunity-header buy">
                            <span>🚀</span> Top Buy Opportunities
                        </div>
                        ${buys.slice(0, 3).map(r => `
                            <div class="top-pick" onclick="showDetails('${r.symbol}')">
                                <div>
                                    <div class="pick-symbol">${r.symbol}</div>
                                    <div class="pick-reason">${generateInsight(r)}</div>
                                </div>
                                <div class="pick-details">
                                    <div class="pick-score buy">+${r.score.toFixed(0)}</div>
                                    <div style="font-size: 0.8rem; color: var(--text-secondary);">$${r.price.toFixed(2)}</div>
                                </div>
                            </div>
                        `).join('') || '<div style="color: var(--text-secondary); padding: 1rem;">No buy signals found</div>'}
                    </div>

                    <div class="opportunity-card sell">
                        <div class="opportunity-header sell">
                            <span>⚠️</span> Sell / Avoid
                        </div>
                        ${sells.slice(-3).reverse().map(r => `
                            <div class="top-pick" onclick="showDetails('${r.symbol}')">
                                <div>
                                    <div class="pick-symbol">${r.symbol}</div>
                                    <div class="pick-reason">${generateInsight(r)}</div>
                                </div>
                                <div class="pick-details">
                                    <div class="pick-score sell">${r.score.toFixed(0)}</div>
                                    <div style="font-size: 0.8rem; color: var(--text-secondary);">$${r.price.toFixed(2)}</div>
                                </div>
                            </div>
                        `).join('') || '<div style="color: var(--text-secondary); padding: 1rem;">No sell signals found</div>'}
                    </div>
                </div>

                <!-- Stats -->
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-value">${results.length}</div>
                        <div class="stat-label">Scanned</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value green">${buys.length}</div>
                        <div class="stat-label">Buy Signals</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value red">${sells.length}</div>
                        <div class="stat-label">Sell Signals</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value green">${strongBuys.length}</div>
                        <div class="stat-label">Strong Buys</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value red">${strongSells.length}</div>
                        <div class="stat-label">Strong Sells</div>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <div class="table-header">
                        <div class="table-title">📊 ${scanName} Scan Results</div>
                    </div>
                    <table class="signals-table">
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Price</th>
                                <th>Signal</th>
                                <th>Score</th>
                                <th>Stop Loss</th>
                                <th>Target</th>
                                <th>Analysis</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            for (const r of results) {
                if (r.error) continue;
                const signalClass = r.signal.toLowerCase();
                const scoreClass = r.score >= 0 ? 'positive' : 'negative';

                html += `
                    <tr onclick="showDetails('${r.symbol}')">
                        <td>
                            <div class="symbol-cell">
                                <div class="symbol-icon">${r.symbol.slice(0,2)}</div>
                                <span class="symbol-name">${r.symbol}</span>
                            </div>
                        </td>
                        <td class="price-cell">$${r.price.toFixed(2)}</td>
                        <td>
                            <span class="signal-badge ${signalClass}">
                                ${r.signal === 'BUY' ? '↑' : r.signal === 'SELL' ? '↓' : '→'} ${r.signal}
                            </span>
                        </td>
                        <td>
                            <div class="score-cell">
                                <div class="score-bar">
                                    <div class="score-bar-fill ${scoreClass}" style="width: ${Math.min(Math.abs(r.score), 100)}%"></div>
                                </div>
                                <span class="score-value ${scoreClass}">${r.score > 0 ? '+' : ''}${r.score.toFixed(0)}</span>
                            </div>
                        </td>
                        <td class="price-cell" style="color: var(--red-bright);">${r.stop_loss ? '$' + r.stop_loss.toFixed(2) : '-'}</td>
                        <td class="price-cell" style="color: var(--green-bright);">${r.take_profit ? '$' + r.take_profit.toFixed(2) : '-'}</td>
                        <td class="reason-cell">${generateInsight(r)}</td>
                    </tr>
                `;
            }

            html += '</tbody></table></div>';
            document.getElementById('mainContent').innerHTML = html;
        }

        // Show details
        async function showDetails(symbol) {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('modalSymbol').textContent = symbol;
            document.getElementById('modalBody').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Loading detailed analysis...</span>
                </div>
            `;

            try {
                const response = await fetch(`/api/analyze/${symbol}`);
                const data = await response.json();
                if (data.success) {
                    displayDetailModal(data);
                }
            } catch (error) {
                document.getElementById('modalBody').innerHTML = `
                    <div class="empty-state">
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Display detail modal
        function displayDetailModal(data) {
            document.getElementById('modalPrice').textContent = `$${data.price.toFixed(2)}`;
            const signalClass = data.signal.type.toLowerCase();

            // Count bullish/bearish indicators
            let bullish = 0, bearish = 0, neutral = 0;
            const keySignals = [];

            for (const [name, ind] of Object.entries(data.indicators)) {
                if (ind.signal.includes('BUY')) {
                    bullish++;
                    if (ind.signal.includes('STRONG')) keySignals.push({name, type: 'bullish', desc: ind.description});
                } else if (ind.signal.includes('SELL')) {
                    bearish++;
                    if (ind.signal.includes('STRONG')) keySignals.push({name, type: 'bearish', desc: ind.description});
                } else {
                    neutral++;
                }
            }

            let html = `
                <div class="signal-summary">
                    <div class="summary-main ${signalClass}">
                        <div class="summary-signal ${signalClass}">
                            ${data.signal.type === 'BUY' ? '🚀' : data.signal.type === 'SELL' ? '🔻' : '➡️'}
                            ${data.signal.strength} ${data.signal.type}
                        </div>
                        <div class="summary-score">Score: ${data.signal.score > 0 ? '+' : ''}${data.signal.score.toFixed(0)} / 100</div>
                    </div>

                    <div class="trade-setup">
                        <div class="trade-setup-title">📋 Trade Setup</div>
                        <div class="trade-row">
                            <span class="trade-label">Entry Price</span>
                            <span class="trade-value">$${data.price.toFixed(2)}</span>
                        </div>
                        <div class="trade-row">
                            <span class="trade-label">Stop Loss</span>
                            <span class="trade-value red">${data.signal.stop_loss ? '$' + data.signal.stop_loss.toFixed(2) : 'N/A'}</span>
                        </div>
                        <div class="trade-row">
                            <span class="trade-label">Take Profit</span>
                            <span class="trade-value green">${data.signal.take_profit ? '$' + data.signal.take_profit.toFixed(2) : 'N/A'}</span>
                        </div>
                        <div class="trade-row">
                            <span class="trade-label">Risk/Reward</span>
                            <span class="trade-value">1:${data.signal.risk_reward ? data.signal.risk_reward.toFixed(1) : 'N/A'}</span>
                        </div>
                    </div>

                    <div class="trade-setup">
                        <div class="trade-setup-title">📊 Indicator Summary</div>
                        <div class="trade-row">
                            <span class="trade-label">Bullish</span>
                            <span class="trade-value green">${bullish}</span>
                        </div>
                        <div class="trade-row">
                            <span class="trade-label">Bearish</span>
                            <span class="trade-value red">${bearish}</span>
                        </div>
                        <div class="trade-row">
                            <span class="trade-label">Neutral</span>
                            <span class="trade-value">${neutral}</span>
                        </div>
                    </div>
                </div>

                ${keySignals.length > 0 ? `
                <div class="analysis-section">
                    <div class="analysis-title">💡 Key Insights</div>
                    ${keySignals.slice(0, 3).map(s => `
                        <div class="key-insight">
                            <div class="insight-text"><strong>${s.name}:</strong> ${s.desc}</div>
                        </div>
                    `).join('')}
                </div>
                ` : ''}

                <div class="analysis-section">
                    <div class="analysis-title">📈 All Indicators</div>
                    <div class="indicators-grid">
            `;

            for (const [name, ind] of Object.entries(data.indicators)) {
                const indClass = ind.signal.includes('BUY') ? 'buy' : ind.signal.includes('SELL') ? 'sell' : 'neutral';
                html += `
                    <div class="indicator-card">
                        <span class="indicator-name">${name}</span>
                        <span class="indicator-signal ${indClass}">${ind.signal.replace('STRONG_', '⭐')}</span>
                    </div>
                `;
            }

            html += `
                    </div>
                </div>

                <div class="chart-section">
                    <div class="analysis-title">📉 Price Chart (90 Days)</div>
                    <canvas id="priceChart" height="250"></canvas>
                </div>
            `;

            document.getElementById('modalBody').innerHTML = html;

            // Draw chart
            if (data.price_history && data.price_history.length > 0) {
                const ctx = document.getElementById('priceChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.price_history.map(p => p.date),
                        datasets: [{
                            label: 'Close',
                            data: data.price_history.map(p => p.close),
                            borderColor: data.signal.type === 'BUY' ? '#10b981' : data.signal.type === 'SELL' ? '#ef4444' : '#f59e0b',
                            backgroundColor: data.signal.type === 'BUY' ? 'rgba(16,185,129,0.1)' : data.signal.type === 'SELL' ? 'rgba(239,68,68,0.1)' : 'rgba(245,158,11,0.1)',
                            fill: true,
                            tension: 0.3,
                            pointRadius: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { color: '#2d3748' }, ticks: { color: '#9ca3af', maxTicksLimit: 8 } },
                            y: { grid: { color: '#2d3748' }, ticks: { color: '#9ca3af' } }
                        }
                    }
                });
            }
        }

        function closeModal(event) {
            if (!event || event.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').classList.remove('active');
            }
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    </script>
</body>
</html>
